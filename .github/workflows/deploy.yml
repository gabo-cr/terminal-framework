name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VITE_CONTENT_BASE_URL: ${{ vars.VITE_CONTENT_BASE_URL }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/terminal-framework/' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Check public build configuration
        run: |
          node --input-type=module <<'JS'
          const root = new URL(process.env.VITE_CONTENT_BASE_URL)
          if (root.protocol !== 'https:' || root.username || root.password || root.search || root.hash) {
            throw new Error('Set VITE_CONTENT_BASE_URL to a public HTTPS content root')
          }
          if (!/^\/(?:[a-zA-Z0-9_-]+\/)*$/.test(process.env.VITE_BASE_PATH)) {
            throw new Error('VITE_BASE_PATH must be / or an absolute path ending in /')
          }
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run typecheck:core
      - run: pnpm run test
      - run: pnpm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
